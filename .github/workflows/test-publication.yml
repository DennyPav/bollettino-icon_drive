name: Test bulletin publication

on:
  pull_request:
    paths:
      - 'bulletin_publication.py'
      - 'first_guess_icon_v4git.py'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'bulletin_publication.py'
      - 'first_guess_icon_v4git.py'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile first_guess_icon_v4git.py bulletin_publication.py
